<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="description"
        content="Full-stack AI assistant built with FastAPI, WebSockets and OpenAI."
    >

    <title>AI Assistant | Full-Stack Chatbot</title>

    <!-- Browser tab AI logo -->
    <link
        rel="icon"
        type="image/jpeg"
        sizes="512x512"
        href="{{ url_for('static', path='/images/ai-logo.jpg') }}"
    >


    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
        crossorigin="anonymous"
    >


    <style>

        body {
            background-color: #f8f9fa;
        }


        /* Chat history */

        .chat-history {

            height: 450px;

            overflow-y: auto;

            display: flex;

            flex-direction: column;

            gap: 10px;

            padding: 20px;
        }


        /* All messages */

        .chat-message {

            width: fit-content;

            max-width: 75%;

            padding: 10px 14px;

            border-radius: 12px;

            word-wrap: break-word;

            white-space: pre-wrap;
        }


        /* User messages */

        .chat-message.user-input {

            background-color: #0d6efd;

            color: white;

            align-self: flex-end;

            border-bottom-right-radius: 4px;
        }


        /* AI messages */

        .chat-message.ai-response {

            background-color: #e9ecef;

            color: #212529;

            align-self: flex-start;

            border-bottom-left-radius: 4px;
        }


        /* Input */

        .chat-input {

            padding-bottom: 30px;
        }


        /* Cards */

        .card {

            border: none;

            border-radius: 12px;
        }


        /* Mobile */

        @media (max-width: 576px) {

            .chat-message {
                max-width: 90%;
            }

            .chat-history {
                height: 60vh;
            }
        }

    </style>

</head>


<body>

    <!-- Navigation -->

    {% include 'navbar.html' %}


    <!-- Page content -->

    <main>

        {% block content %}
        {% endblock %}

    </main>


    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous">
    </script>

</body>

</html>
